name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk RadioKashmir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RadioKashmir-apk
          path: RadioKashmir.apk

      - name: Publish as a release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Radio Kashmir 2.0.${{ github.run_number }}
          body: Kashmir-only stations. Download RadioKashmir.apk below and open it on your phone to install or update.
          files: RadioKashmir.apk
          make_latest: true
